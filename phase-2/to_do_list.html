<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="top">
        <div class="left_controls">
            <div class="controls">
               <select id="filter">
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                    <option value="incomplete">Incomplete</option>
                </select>
            </div>
            tasks
            <span id="task_count">0 </span>
        </div>

        <button class="add" id="add">Add Task</button>
    </div>

    <div class="maintab">  

        <div class="task_list" id="task_list">
            <div class="task">
                <h6>task-1</h6>

                <select name="status">
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                    <option value="incomplete">Incomplete</option>
                </select>

                <div class="btns">
                    <button class="delete_task">delete</button>
                    <button class="edit_task">edit</button>
                </div>
            </div>
        </div>

        <div class="creation" id="creation">
            <div class="card">
                <label>Task name</label>
                <input type="text" placeholder="task name" id="name">  
                <button class="save_task" id="save">Save Task</button>
            </div>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
